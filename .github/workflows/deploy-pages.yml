name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Antes de publicar: sintaxis, análisis del código y pruebas rápidas (sin
  # navegador). Si algo falla, no se publica y la versión anterior sigue en
  # línea.
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node pruebas/sintaxis.js
      - run: npm install --no-save --no-audit --no-fund eslint@10.12.0 globals@17.12.0
      - run: node pruebas/analisis.js
      - run: node pruebas/worker.test.mjs
      - run: node pruebas/whatsapp-worker.test.mjs
      - run: node pruebas/fotos-script.test.mjs

  deploy:
    needs: validar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
