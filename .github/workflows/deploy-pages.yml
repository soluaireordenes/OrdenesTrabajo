name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Antes de publicar: sintaxis, análisis del código y pruebas rápidas (sin
  # navegador). Si algo falla, no se publica y la versión anterior sigue en
  # línea.
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - run: node pruebas/sintaxis.js
      - run: npm install --no-save --no-audit --no-fund eslint@10.12.0 globals@17.12.0
      - run: node pruebas/analisis.js
      - run: node pruebas/worker.test.mjs
      - run: node pruebas/whatsapp-worker.test.mjs
      - run: node pruebas/fotos-script.test.mjs
      - run: node pruebas/respaldo-script.test.mjs

  # Armar y subir el paquete del sitio. Va en su propio trabajo, separado de
  # la publicación, como en la plantilla de GitHub: publicando en el mismo
  # trabajo, a veces GitHub todavía no listaba el paquete recién subido
  # (medio segundo después) y la publicación fallaba con "No artifacts
  # named github-pages were found".
  armar:
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Se publica solo la app: antes subía la carpeta entera ('.'), y
      # quedaban servidos desde la dirección de la app el código del proxy,
      # de los scripts, del bot y las pruebas.
      - name: Armar la carpeta con solo la app
        run: |
          mkdir _sitio
          cp index.html sw.js manifest.json privacidad.html favicon.png icon-192.png icon-512.png icon-512-maskable.png _sitio/
          cp -r vendor _sitio/

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_sitio'

  deploy:
    needs: armar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
