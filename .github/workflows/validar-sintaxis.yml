name: Validar sintaxis

# Corre en cada pull request y en cada cambio que llega a main. Las pruebas no
# tocan datos reales: Google, el proxy y el Apps Script van simulados (ver
# pruebas/README.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sintaxis de index.html y sw.js
        run: node pruebas/sintaxis.js

      - name: Análisis del código (nombres que no existen, duplicados, onclick)
        run: |
          npm install --no-save --no-audit --no-fund eslint@10.12.0 globals@17.12.0
          node pruebas/analisis.js

      - name: Pruebas del proxy de seguridad
        run: node pruebas/worker.test.mjs

      - name: Pruebas del intermediario de WhatsApp
        run: node pruebas/whatsapp-worker.test.mjs

      - name: Pruebas del script de fotos
        run: node pruebas/fotos-script.test.mjs

  app:
    # La app en un navegador real (Chromium). Tarda un par de minutos: una de
    # las pruebas espera ~45 s a propósito (informe con el servidor colgado).
    runs-on: ubuntu-latest
    needs: validar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save playwright@1.56.1
          # El navegador se baja del sitio de Playwright.
          npx playwright install chromium
          # Las librerías y fuentes del sistema vienen de los espejos de Ubuntu.
          # Si esos espejos no responden (en noviembre de 2026 fallaron por
          # horas: "Temporary failure resolving azure.archive.ubuntu.com"), la
          # revisión no se cae por eso: la imagen de GitHub ya trae lo que
          # necesita Chromium, y si algo faltara, las pruebas lo dirían.
          timeout 240 npx playwright install-deps chromium \
            || echo "::warning::No se pudieron instalar las dependencias del sistema de Chromium (espejos de Ubuntu); se sigue con las de la imagen."

      - name: Pruebas de la app
        run: node pruebas/app.test.js
